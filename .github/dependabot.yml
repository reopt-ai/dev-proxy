version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10
    ignore:
      # v10 needs conventional-changelog-writer@9, which semantic-release's
      # release-notes-generator does not ship yet; v10 breaks the release job.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
